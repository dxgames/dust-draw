<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>DUST & DRAW</title>

<meta property="og:title" content="DUST & DRAW - Un Duelo Rápido">
<meta property="og:description" content="¡Sé el vaquero más rápido del Oeste! Un juego de reflejos para navegador.">
<meta property="og:image" content="https://i.postimg.cc/G29G0wmK/previsualizacion.jpg">

<link rel="apple-touch-icon" href="https://i.postimg.cc/QMCFv1X0/icono.png">
<link rel="icon" href="https://i.postimg.cc/QMCFv1X0/icono.png">
<style>
    /* ==========================
       ESTILOS v1.0 - VERTICAL FINAL
    ========================== */
    body { 
        display:flex; 
        justify-content:center; 
        align-items:center; 
        height:100vh; 
        width: 100vw;
        margin:0; 
        background: #000;
        font-family:'Courier New', monospace; 
        user-select:none; 
        overflow:hidden; 
        flex-direction:column; 
    }

    .game-container { 
        width:100%; 
        height:100%; 
        position:relative; 
        border:none; 
        box-shadow:none; 
        overflow:hidden; 
        cursor:pointer; 
    }
    
    .pixel-text { color:#ffcc00; text-shadow:2px 2px 0 #8c5d3f,4px 4px 0 #331a1a; font-weight:bold; line-height:1.2; padding:5px; text-transform:uppercase; }

    #img-background { 
        position:absolute; 
        width:100%; 
        height:100%; 
        top:0; 
        left:0; 
        background-image:url('https://i.postimg.cc/d3mTjw6Z/escenario.png'); 
        background-size:cover; 
        background-position:center bottom; 
        z-index:1; 
    }

    #title { 
        position:absolute; 
        top:5%; 
        left:50%; 
        transform:translateX(-50%); 
        width:90%; 
        max-width: 600px;
        height:15vh; 
        background-image:url('https://i.postimg.cc/1XcNrsBN/título.png'); 
        background-size:contain; 
        background-repeat:no-repeat; 
        background-position:center top; 
        z-index:20; 
    }

    .character { 
        position:absolute; 
        bottom:15%; 
        width:25vw; 
        height:25vh; 
        max-width: 140px; 
        max-height: 210px;
        background-size:contain; 
        background-repeat:no-repeat; 
        background-position:center bottom; 
        transition:background-image .05s, opacity .3s, filter .1s; 
        z-index:5; 
    }

    #player-cowboy { left:5%; background-image:url('https://i.postimg.cc/MHD8YFQH/vaquerodesarmado.png'); }
    #enemy-cowboy  { right:5%; background-image:url('https://i.postimg.cc/KjNy5HMz/forajidodesarmado.png'); }

    .armed-player{ background-image:url('https://i.postimg.cc/FzZQxBLK/vaqueroarmado.png') !important; }
    .armed-enemy{ background-image:url('https://i.postimg.cc/BbgGCVKX/forajidoarmado.png') !important; }

    .dead-player{ background-image:url('https://i.postimg.cc/1tz9jPyz/vaqueromuerto.png') !important; opacity:1; filter:grayscale(100%); }
    .dead-enemy{ background-image:url('https://i.postimg.cc/HWRpBfRX/forajidomuerto.png') !important; opacity:1; filter:grayscale(100%); }

    @keyframes flash { 0%{filter:brightness(1);} 50%{filter:brightness(1.5);} 100%{filter:brightness(1);} }
    .shooting{ animation:flash .15s ease-out; }

    #message-area{ position:absolute; top:45%; left:50%; transform:translate(-50%,-50%); text-align:center; z-index:15; width:90%; pointer-events:none; }
    
    #countdown{ font-size:12vw; color:#fff; text-shadow:4px 4px 0 #c95c46; margin-bottom:20px; } 
    #result-message{ margin-top:20px; font-size:6vw; font-weight:bold; color:#ffcc00; display:none; background:rgba(0,0,0,0.7); padding:10px; border:2px solid #c95c46; white-space:pre-wrap; text-shadow:2px 2px 0 black; width: 80%; margin-left: auto; margin-right: auto; border-radius: 10px;}

    #menu-container{ 
        position:absolute; 
        top:50%; 
        left:50%; 
        transform:translate(-50%,-50%); 
        z-index:30; 
        text-align:center; 
        background:rgba(0,0,0,0.85); 
        padding:20px; 
        border:4px solid #c28b55; 
        display:none; 
        width: 80%; 
        max-width: 400px;
        border-radius: 10px;
    }
    .menu-header{ font-size:24px; margin-bottom:12px; color:#ffcc00; }
    .menu-option{ font-size:20px; margin:15px 0; cursor:pointer; color:#fff; padding:10px; border-radius:6px; border: 1px solid rgba(255,255,255,0.1); }
    .menu-option:hover{ background:rgba(255,204,0,0.1); color:#ffcc00; border-color: #ffcc00; }

    .disabled { color:#777; cursor:default; border-color: transparent; } 
    .active-difficulty{ color:#79c946 !important; text-shadow:3px 3px 0 #4c7a28 !important; border-color: #79c946 !important; }
    .active-toggle { color: #ffcc00 !important; text-shadow: 2px 2px 0 #8c5d3f !important; }
    .back-button{ margin-top:15px; font-size:18px; color:#fff; cursor:pointer; opacity:.9; padding: 10px;}
</style>
</head>

<body>

<div class="game-container" id="game-container">
    <div id="img-background"></div>
    <div id="title"></div>

    <div class="character" id="player-cowboy"></div>
    <div class="character" id="enemy-cowboy"></div>

    <div id="message-area">
        <div id="countdown" class="pixel-text">TOCA PARA JUGAR</div>
        <div id="result-message" class="pixel-text"></div>
    </div>

    <div id="menu-container">
        <div class="menu-header pixel-text" id="menu-header">MENÚ PRINCIPAL</div>
        <div id="menu-content"></div>
        <div id="menu-back" class="back-button">← Volver</div>
    </div>
</div>

<script>
/* ==========================
        ESTADO GLOBAL
========================== */

const gameContainer = document.getElementById("game-container");
const countdownDisplay = document.getElementById("countdown");
const resultMessage = document.getElementById("result-message");
const playerCowboy = document.getElementById("player-cowboy");
const enemyCowboy = document.getElementById("enemy-cowboy");
const menuContainer = document.getElementById("menu-container");
const menuHeader = document.getElementById("menu-header");
const menuContent = document.getElementById("menu-content");
const menuBack = document.getElementById("menu-back");
const title = document.getElementById("title");

let gameState = "TITLE";
let isCountingDown = false;
let isDrawTime = false;

let playerShotTime = 0;
let enemyShotTime = 0;
let drawStartTime = 0;

let countdownTimer;
let drawTimeout;

/* ==========================
        DIFICULTADES
========================== */
const DIFFICULTY_MODIFIERS = {
    EASY: { min: 800, max: 2000 },
    NORMAL: { min: 500, max: 1000 },
    HARD: { min: 100, max: 500 },
    IMPOSSIBLE: { min: 60, max: 200 }
};

let savedDiff = localStorage.getItem("dx_difficulty");
let currentDifficulty = DIFFICULTY_MODIFIERS[savedDiff] ? savedDiff : "EASY";

/* ==========================
          AUDIO & FULLSCREEN
========================== */
let isSoundEnabled = (localStorage.getItem("dx_sound") === "false" ? false : true); 
let isMusicEnabled = (localStorage.getItem("dx_music") === "false" ? false : true); 
let audioCtx = null;

function ensureAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}

function playBeep(duration=0.07, freq=900) {
    if (!isSoundEnabled) return; 
    try {
        ensureAudio();
        const o = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        o.type = "square";
        o.frequency.value = freq;
        g.gain.value = 0.06;
        o.connect(g);
        g.connect(audioCtx.destination);
        o.start();
        g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        setTimeout(()=>{ try{o.stop();}catch(e){} }, duration * 1000 + 20);
    } catch(e){}
}

function toggleFullScreen(e) {
    if (e) e.stopPropagation();
    if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(err => console.log(err));
    } else {
        if (document.exitFullscreen) document.exitFullscreen();
    }
}

/* ==========================
            MENÚS
========================== */
menuBack.addEventListener("click", () => showMainMenu());

function showMenu(titleText, html, showBack=true) {
    menuHeader.textContent = titleText;
    menuContent.innerHTML = html;
    menuContainer.style.display = "block";
    menuBack.style.display = showBack ? "block" : "none";
    countdownDisplay.style.display = "none";
    resultMessage.style.display = "none";
    title.style.display = "block";
    gameState = "MENU";
}

function hideMenu() {
    menuContainer.style.display = "none";
    title.style.display = "none";
}

function showMainMenu() {
    showMenu("MENÚ PRINCIPAL", `
        <div class="menu-option" onclick="showPlayMenu(event)">JUGAR</div>
        <div class="menu-option" onclick="showSettingsMenu(event)">AJUSTES</div>
        <div class="menu-option" onclick="showAbout(event)">ACERCA DEL JUEGO</div>
    `, false);
}

function showPlayMenu(e) {
    e.stopPropagation();
    showMenu("JUGAR", `
        <div class="menu-option" onclick="showDifficultyMenu(event)">VS CPU</div>
        <div class="menu-option disabled">1 VS 1</div>
    `);
}

function showSettingsMenu(e) {
    e.stopPropagation();
    const soundState = isSoundEnabled ? "ACTIVADO" : "DESACTIVADO";
    const musicState = isMusicEnabled ? "ACTIVADA" : "DESACTIVADA";

    showMenu("AJUSTES", `
        <div class="menu-option" onclick="toggleFullScreen(event)">PANTALLA COMPLETA [ ]</div>
        <div class="menu-option ${isSoundEnabled ? 'active-toggle' : ''}"
             onclick="toggleSetting(event, 'sound')">SONIDO: ${soundState}</div>
        <div class="menu-option ${isMusicEnabled ? 'active-toggle' : ''} disabled"
             onclick="return false;">MÚSICA: ${musicState}</div>
    `);
}

function toggleSetting(e, type) {
    e.stopPropagation();
    if (type === 'sound') {
        isSoundEnabled = !isSoundEnabled;
        localStorage.setItem("dx_sound", isSoundEnabled);
        playBeep(0.04, isSoundEnabled ? 1300 : 300); 
    } 
    showSettingsMenu({stopPropagation:()=>{}});
}

function showDifficultyMenu(e) {
    e.stopPropagation();
    const opt = (key,label) =>
        `<div class="menu-option ${currentDifficulty===key?'active-difficulty':''}"
             onclick="selectDifficulty(event,'${key}', true)">${label}</div>`;

    showMenu("DIFICULTAD",
        opt("EASY","FÁCIL") + opt("NORMAL","NORMAL") + opt("HARD","DIFÍCIL") + opt("IMPOSSIBLE","IMPOSIBLE"),
    );
}

function showAbout(e) {
    e.stopPropagation();
    showMenu("ACERCA DEL JUEGO", `
        <div class="menu-option" style="color:white;">CREADO POR DX GAMES</div>
        <div class="menu-option" style="color:#ddd;">Versión: v1.0 (Vertical)</div>
        <div class="menu-option" style="color:white;">¡GRACIAS POR JUGAR!</div>
    `);
}

function selectDifficulty(e, diff, shouldStartGame = false) {
    e.stopPropagation();
    currentDifficulty = diff;
    localStorage.setItem("dx_difficulty", diff);
    if (shouldStartGame) startGame(e);
    else showDifficultyMenu({stopPropagation:()=>{}}); 
}

/* ==========================
        GAMEPLAY
========================== */
function resetCharacters() {
    playerCowboy.className = "character";
    enemyCowboy.className = "character";
}

function startGame(e) { 
    if(e) e.stopPropagation();
    gameState = "ACTIVE";
    hideMenu();
    resetCharacters();

    playerShotTime = 0;
    enemyShotTime = 0;

    countdownDisplay.textContent = "¡PREPARADOS!";
    countdownDisplay.style.display = "block";
    isCountingDown = true;
    isDrawTime = false;

    let count = 3;
    setTimeout(()=>{
        countdownDisplay.textContent = count;
        countdownTimer = setInterval(()=>{
            count--;
            playBeep(0.07, count > 0 ? 900 : 1500); 
            if (count > 0) countdownDisplay.textContent = count;
            else {
                clearInterval(countdownTimer);
                countdownDisplay.textContent = "¡DISPARA!";
                startDrawPhase();
            }
        }, 1000);
    }, 800);
}

function startDrawPhase() {
    isCountingDown = false;
    isDrawTime = true;
    setTimeout(()=>{
        drawStartTime = Date.now();
        const mod = DIFFICULTY_MODIFIERS[currentDifficulty];
        const reaction = Math.random() * (mod.max - mod.min) + mod.min;
        drawTimeout = setTimeout(()=>{
            if (isDrawTime && enemyShotTime === 0) enemyShoot();
        }, reaction);
    }, 60);
}

function playerShoot() {
    if (isCountingDown) {
        playerCowboy.classList.add("dead-player");
        playBeep(0.05, 280);
        endGame("¡PERDISTE!\nFUEGO ANTICIPADO!");
        return;
    }
    if (!isDrawTime || playerShotTime !== 0) return;
    playerShotTime = Date.now() - drawStartTime;
    playerCowboy.classList.add("armed-player","shooting");
    void playerCowboy.offsetHeight;
    playBeep(0.06, 1100);
    setTimeout(() => { resolveWinner(); }, 120);
}

function enemyShoot() {
    if (!isDrawTime || enemyShotTime !== 0) return;
    enemyShotTime = Date.now() - drawStartTime;
    enemyCowboy.classList.add("armed-enemy","shooting");
    void enemyCowboy.offsetHeight;
    playBeep(0.05, 700);
    setTimeout(() => { resolveWinner(); }, 120);
}

function resolveWinner() {
    if (!isDrawTime) return;
    isDrawTime = false; 
    clearTimeout(drawTimeout); 
    const p = playerShotTime;
    const e = enemyShotTime;
    let msg = "";

    if (p === 0 && e === 0) msg = `¡NADIE DISPARÓ!\nDEMASIADO LENTO.`;
    else if (p > 0 && e > 0 && Math.abs(p - e) <= 5) {
        playerCowboy.classList.add("dead-player");
        enemyCowboy.classList.add("dead-enemy");
        msg = `¡EMPATE!\nAmbos: ${Math.round((p + e) / 2)}ms\n¡NO HAY GANADOR!`;
    }
    else if (p > 0 && e > 0) {
        if (p < e) {
            enemyCowboy.classList.add("dead-enemy");
            msg = `¡GANASTE!\nTU: ${p}ms\nFORAJIDO: ${e}ms\n¡MUY RÁPIDO!`;
        } else {
            playerCowboy.classList.add("dead-player");
            msg = `¡PERDISTE!\nFORAJIDO: ${e}ms\nTU: ${p}ms\n¡MUY LENTO!`;
        }
    }
    else if (p > 0 && e === 0) {
        enemyCowboy.classList.add("dead-enemy");
        msg = `¡GANASTE!\nTU: ${p}ms\n¡MUY RÁPIDO!`;
    }
    else if (e > 0 && p === 0) {
        playerCowboy.classList.add("dead-player");
        msg = `¡PERDISTE!\nFORAJIDO: ${e}ms\n¡MUY LENTO!`;
    }
    endGame(msg);
}

function endGame(msg) {
    clearInterval(countdownTimer);
    clearTimeout(drawTimeout);
    countdownDisplay.textContent = "FIN DEL DUELO";
    resultMessage.textContent = msg;
    setTimeout(()=> resultMessage.style.display = "block", 800);
    gameState = "WAITING_RESTART";
}

function handleInput() {
    if (gameState === "TITLE") { showMainMenu(); return; }
    if (menuContainer.style.display === "block") return;
    if (isCountingDown || isDrawTime) { playerShoot(); return; }
    if (gameState === "WAITING_RESTART") { resetCharacters(); showMainMenu(); }
}
gameContainer.addEventListener("click", handleInput);
countdownDisplay.textContent = "TOCA PARA JUGAR";
</script>
</body>
</html>
